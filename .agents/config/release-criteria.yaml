# =============================================================================
# Release Criteria — リリース可否の判定条件
# =============================================================================
# CI (.github/workflows/security-gate.yml) と Hermes (release-readiness-audit)
# の両方がこのファイルを唯一の判定基準として参照する。
# ⚠️ protected: エージェントによる自動変更・自動マージ禁止（人間承認必須）
# =============================================================================

version: 1

# 判定は上から順に評価し、1つでも fail ならリリース不可
rules:
  - id: scan-executed
    description: 対象スコープでスキャンが実施されている
    check: "runs.exists(scope=current) == true"
    severity: blocker

  - id: scan-freshness
    description: スキャン結果が新しい（設定変更による劣化を拾うため）
    check: "age_days(latest_run) <= 14"
    severity: blocker

  - id: scope-integrity
    description: スコープ違反がゼロ（1件でもあればインシデント扱い）
    check: "metrics.scope_violations == 0"
    severity: blocker

  - id: critical-findings
    description: critical の未解決所見がゼロ
    check: "findings.count(severity=critical, status in [open, retest_failed]) == 0"
    severity: blocker

  - id: high-findings
    description: high の未解決所見がゼロ（例外は accepted_risk として承認者の記録が必要）
    check: "findings.count(severity=high, status in [open, retest_failed], no_accepted_risk) == 0"
    severity: blocker

  - id: high-findings-aging
    description: high の受容リスクは90日で失効する
    check: "findings.count(severity=high, status=accepted_risk, age_days > 90) == 0"
    severity: blocker

  - id: medium-backlog
    description: medium の未解決が閾値以下（劣化の早期検知）
    check: "findings.count(severity=medium, status=open) <= 10"
    severity: warning

  - id: corpus-regression
    description: 検出精度がコーパス基準を下回っていない（ハーネス自体の劣化検知）
    check: "metrics.recall_at_corpus >= 0.70 and metrics.precision >= 0.60"
    severity: warning

  - id: budget
    description: 当月のペネトレ予算（USD とトークン）を超過していない
    check: "metrics.month_to_date_usd <= policy.limits.monthly_budget_usd and metrics.month_to_date_tokens <= policy.limits.monthly_tokens"
    severity: blocker

# 免除（grant）— 記録が残る形でのみ許可
exemptions:
  require_fields: [rule_id, reason, approver, expires_at]
  max_days: 90
  store: .pentest/exemptions.yaml

outputs:
  - format: sarif
    path: .pentest/findings.sarif
  - format: summary_json
    path: .pentest/gate-result.json
