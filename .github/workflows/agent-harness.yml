name: Agent Harness
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task description for the agent to execute"
        required: true
        type: string
      agent:
        description: "Agent to use for execution"
        required: true
        default: stub
        type: choice
        options:
          - hermes
          - opencode
          - claude
          - stub
  # Scheduled automations: daily CI triage (weekdays at 07:00 UTC)
  schedule:
    - cron: '0 7 * * 1-5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-agent:
    name: Agent Execution (${{ inputs.agent || 'scheduled' }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate task input
        env:
          EVENT_NAME: ${{ github.event_name }}
          TASK: ${{ inputs.task }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            exit 0
          fi
          python3 - <<'PY'
          import os
          import sys

          task = os.environ.get("TASK", "")
          if len(task) > 4000:
              print("::error::task exceeds 4000 characters")
              sys.exit(1)

          def allowed(ch):
              if ch.isascii() and ch.isalnum():
                  return True
              if ch in " \t\n\r-_.,:/?!()[]'\"":
                  return True
              return (
                  "\u3040" <= ch <= "\u30ff"
                  or "\u3400" <= ch <= "\u4dbf"
                  or "\u4e00" <= ch <= "\u9fff"
              )

          bad = [ch for ch in task if not allowed(ch)]
          if bad:
              print(f"::error::task contains disallowed characters: {bad[:5]!r}")
              sys.exit(1)
          PY

      - name: Create branch
        id: branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            BRANCH="automation/daily-triage/$(date +%Y%m%d)"
          else
            BRANCH="agent/$ACTOR/$(date +%s)"
          fi
          git checkout -b "$BRANCH"
          DELIM="EOF_$(date +%s%N)_$RANDOM"
          {
            printf 'BRANCH<<%s\n%s\n%s\n' "$DELIM" "$BRANCH" "$DELIM"
          } >> "$GITHUB_ENV"
          {
            printf 'branch<<%s\n%s\n%s\n' "$DELIM" "$BRANCH" "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Determine task
        id: task
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TASK: ${{ inputs.task }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            TASK="Run daily CI triage: check latest CI runs on main, open issues, recent commits. Categorize findings. Write triage report to learnings/triage-$(date +%F).md"
          else
            TASK="$INPUT_TASK"
          fi
          DELIM="EOF_$(date +%s%N)_$RANDOM"
          {
            printf 'TASK<<%s\n%s\n%s\n' "$DELIM" "$TASK" "$DELIM"
          } >> "$GITHUB_ENV"

      - name: Install agent (${{ inputs.agent || 'stub' }})
        if: github.event_name != 'schedule'
        env:
          AGENT_INPUT: ${{ inputs.agent }}
        run: |
          AGENT="$AGENT_INPUT"
          [ -z "$AGENT" ] && AGENT="stub"
          case "$AGENT" in
            hermes)
              echo "::group::Install Hermes Agent"
              pip install hermes-agent 2>/dev/null || echo "⚠️  Hermes install failed, using stub mode"
              echo "::endgroup::"
              ;;
            opencode)
              echo "::group::Install Opencode"
              npm install -g @opencode/opencode 2>/dev/null || echo "⚠️  Opencode install failed, using stub mode"
              echo "::endgroup::"
              ;;
            claude)
              echo "::group::Install Claude Code"
              npm install -g @anthropic-ai/claude-code@2.1.309 2>/dev/null || echo "⚠️  Claude Code install failed, using stub mode"
              echo "::endgroup::"
              ;;
          esac

      - name: Run task (scheduled — daily triage)
        if: github.event_name == 'schedule'
        run: |
          echo "::notice title=Daily Triage::Running daily CI triage..."
          bash scripts/daily-triage.sh
          echo "status=completed" >> $GITHUB_OUTPUT

      - name: Run agent task (manual dispatch)
        if: github.event_name != 'schedule'
        id: agent-run
        env:
          TASK: ${{ env.TASK }}
          AGENT_INPUT: ${{ inputs.agent }}
        run: |
          echo "::notice title=Agent Task::$TASK"
          bash scripts/agent-runner.sh "${AGENT_INPUT:-stub}" "$TASK"
          printf 'status=completed\n' >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v7
        continue-on-error: true
        with:
          branch: "${{ steps.branch.outputs.branch }}"
          base: develop
          title: "${{ env.TASK }}"
          body: |
            ## 🤖 Automated Agent Run

            **Task:** ${{ env.TASK }}
            **Agent:** ${{ inputs.agent || 'scheduled' }}
            **Trigger:** ${{ github.event_name }}

            This PR was automatically created by the Agent Harness workflow.
            Please review the changes before merging.
          labels: |
            automated
            agent-run
          add-paths: |
            learnings/
            traces/
            .agent/
            STATE.md
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: PR result
        env:
          PR_OUTCOME: ${{ steps.pr.outcome }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          if [ "$PR_OUTCOME" = "failure" ]; then
            echo "⚠️  PR creation skipped or failed (no changes or branch issue). This is normal for scheduled runs with no new findings."
          else
            echo "Pull request operation: $PR_OPERATION"
            echo "Pull request number: $PR_NUMBER"
            if [ "$PR_OPERATION" = "none" ]; then
              echo "✅ No changes detected — nothing to PR."
            elif [ "$PR_OPERATION" = "created" ]; then
              echo "✅ PR #$PR_NUMBER created."
            elif [ "$PR_OPERATION" = "updated" ]; then
              echo "✅ PR #$PR_NUMBER updated."
            fi
          fi
