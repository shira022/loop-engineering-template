name: Release
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release type
        id: type
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::invalid tag name: $TAG"
            exit 1
          fi
          PRERELEASE="false"
          if echo "$TAG" | grep -qE '-(alpha|beta|rc|dev)'; then
            PRERELEASE="true"
          fi
          printf 'prerelease=%s\n' "$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            printf 'notes=Initial release\n' >> "$GITHUB_OUTPUT"
          else
            NOTES=$(git log --oneline --no-decorate "$PREV_TAG..HEAD" 2>/dev/null | grep -E '^(feat|fix|docs|chore|refactor|security)' || echo "No structured commits found")
            DELIM="EOF_$(date +%s%N)_$RANDOM"
            {
              printf 'notes<<%s\n%s\n%s\n' "$DELIM" "$NOTES" "$DELIM"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }}

            ${{ steps.notes.outputs.notes }}

            ### What's Changed
            See the full commit log for details.
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.type.outputs.prerelease }}
